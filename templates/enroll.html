{% extends "layout.html" %}

{% block content %}
<div class="max-w-xl mx-auto px-4 fade-in">
    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-rose-400">
            Enroll New User
        </h1>
        <p class="text-slate-400 mt-2 text-sm">Add a person to the recognition database.</p>
    </div>

    <!-- Form Container -->
    <div class="bg-slate-800/40 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden border border-white/5">
        <div class="p-8">
            <form action="/enroll" method="post" enctype="multipart/form-data" class="space-y-6">
                <!-- Name Input -->
                <div class="space-y-2">
                    <label for="name" class="block text-sm font-medium text-slate-300">Full Name</label>
                    <div class="relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input type="text" name="name" id="name" required
                            class="focus:ring-pink-500 focus:border-pink-500 block w-full pl-10 sm:text-sm border-slate-600 rounded-xl bg-slate-900/50 text-white placeholder-slate-500 py-3"
                            placeholder="John Doe">
                    </div>
                </div>

                <!-- File Upload -->
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-slate-300">Reference Photos (2-5)</label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-slate-700/50 border-dashed rounded-2xl hover:border-pink-500/50 hover:bg-slate-900/40 transition-all duration-200 cursor-pointer group"
                        onclick="document.getElementById('file').click()">
                        <div class="space-y-1 text-center">
                            <div
                                class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-pink-500/10 group-hover:scale-110 transition-transform duration-300">
                                <svg class="h-6 w-6 text-pink-400" stroke="currentColor" fill="none" viewBox="0 0 48 48"
                                    aria-hidden="true">
                                    <path
                                        d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </div>
                            <div class="flex text-sm text-slate-400 justify-center">
                                <label for="file"
                                    class="relative cursor-pointer rounded-md font-medium text-pink-400 hover:text-pink-300 focus-within:outline-none">
                                    <span>Upload files</span>
                                    <input id="file" name="file" type="file" class="sr-only" multiple accept="image/*"
                                        onchange="previewFiles(this)">
                                </label>
                                <p class="pl-1">or drag and drop</p>
                            </div>
                            <p class="text-xs text-slate-500">Max 5 images (JPG, PNG)</p>
                        </div>
                    </div>
                </div>

                <!-- Preview Area -->
                <div id="preview-grid" class="grid grid-cols-2 gap-2 mt-4 hidden">
                    <!-- Previews injected via JS -->
                </div>

                <!-- Submit Button -->
                <button type="submit" onclick="return validateForm()"
                    class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg text-sm font-bold text-white bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-500 transition-all duration-300 transform hover:scale-[1.02] hover:shadow-pink-500/20">
                    Register User
                </button>
            </form>
        </div>

        <!-- Info Footer -->
        <div class="px-8 py-4 bg-slate-900/30 border-t border-white/5">
            <div class="flex items-start">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-indigo-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-indigo-300">Quality Tip</h3>
                    <div class="mt-1 text-xs text-slate-400">
                        Use clear, front-facing photos with good lighting. Avoid sunglasses or masks for best accuracy.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Global File Store
    let dt = new DataTransfer();

    function validateForm() {
        if (dt.files.length < 2) {
            alert("Please upload at least 2 reference photos.");
            return false;
        }
        return true;
    }

    function previewFiles(input) {
        const previewGrid = document.getElementById('preview-grid');

        // Add new files to DataTransfer
        if (input.files && input.files.length > 0) {
            Array.from(input.files).forEach(file => {
                // Prevent duplicates based on name/size
                let exists = Array.from(dt.files).some(f => f.name === file.name && f.size === file.size);
                if (!exists && dt.files.length < 5) {
                    dt.items.add(file);
                }
            });
        }

        // Update the visual UI
        updateUI();

        // Update the Input Value (crucial for form submit)
        input.files = dt.files;
    }

    function updateUI() {
        const previewGrid = document.getElementById('preview-grid');
        previewGrid.innerHTML = '';

        if (dt.files.length > 0) {
            previewGrid.classList.remove('hidden');

            Array.from(dt.files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    // Container
                    const div = document.createElement('div');
                    div.className = "relative group aspect-square";

                    // Image
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = "w-full h-full object-cover rounded-xl border border-slate-600/50 shadow-md";

                    // Remove Button
                    const btn = document.createElement('button');
                    btn.type = "button"; // Prevent form submit
                    btn.className = "absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-lg hover:bg-red-600 transition-colors transform hover:scale-110";
                    btn.innerHTML = `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>`;

                    btn.onclick = () => removeFile(index);

                    div.appendChild(img);
                    div.appendChild(btn);
                    previewGrid.appendChild(div);
                }
                reader.readAsDataURL(file);
            });
        } else {
            previewGrid.classList.add('hidden');
        }
    }

    function removeFile(index) {
        // Create new DataTransfer
        const newDt = new DataTransfer();

        Array.from(dt.files).forEach((file, i) => {
            if (i !== index) newDt.items.add(file);
        });

        dt = newDt;

        // Update Input and UI
        document.getElementById('file').files = dt.files;
        updateUI();
    }
</script>
{% endblock %}
